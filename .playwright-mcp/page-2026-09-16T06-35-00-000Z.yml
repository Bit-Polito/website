            - paragraph [ref=f1e28]: About us
            - heading "The bridge between academia and Bitcoin." [level=1] [ref=f1e29]
            - paragraph [ref=f1e30]: BitPolito is a student team at Politecnico di Torino and one of Italy's leading Bitcoin initiatives. We create opportunities to learn, build and connect around Bitcoin technology.
