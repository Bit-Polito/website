        - generic [ref=f1e44]:
          - generic [ref=f1e45]:
            - paragraph [ref=f1e46]: Our mission
            - heading "Understanding Bitcoin beyond finance." [level=2] [ref=f1e47]
          - generic [ref=f1e48]:
            - paragraph [ref=f1e49]: Founded four years ago, BitPolito has grown rapidly while staying focused on a deeper understanding and awareness of Bitcoin. We explore its technological and social dimensions, avoiding financial topics.
            - paragraph [ref=f1e50]: Our work spans computer science and mathematical R&D, education through courses and events, industry conferences and educational content with a scientific approach and a youthful voice.
            - paragraph [ref=f1e51]: BitGeneration, our successful lecture series for high schools, offers a solid overview of Bitcoin. Internally, members train together, contribute to FOSS projects and gain hands-on experience on challenging real-world work.
            - paragraph [ref=f1e52]: Inspired by the Cypherpunk movement, we stand for freedom, privacy and open-source principles. We collaborate with institutions, businesses and organisations to advocate the free and responsible use of technology.
        - generic [ref=f1e53]:
